name: Build & Deploy to GitHub Pages

# Builds the Vite frontend (bun install --frozen-lockfile, vite build) and
# publishes dist/ to GitHub Pages on every push to main.
# In repo Settings → Pages → Build and deployment → Source, choose
# "GitHub Actions".
#
# NOTE: this deploys the FRONTEND ONLY as a static site. The Express backend
# (server.ts) does not run on GitHub Pages — see README for backend hosting.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
